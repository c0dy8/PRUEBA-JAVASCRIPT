<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RestorApp Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="login.js" defer></script>

    <!-- Tu CSS -->
    <link rel="stylesheet" href="loginstyle.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="login-card text-center p-4 shadow rounded bg-white" style="width: 360px;">
        <div class="app-icon mb-3">
            <i class="bi bi-x-lg fs-3"></i>
        </div>

        <h4 class="fw-bold">RestorApp</h4>
        <p class="text-muted mb-4">Login to your account</p>

        <form id="loginForm">

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <input 
                    type="text" 
                    id="name" 
                    class="form-control" 
                    placeholder="e.g. John Doe"
                    required
                >
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="name@example.com"
                    required
                >
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text">
                    <i class="bi bi-briefcase"></i>
                </span>
                <select id="role" class="form-select">
                    <option value="User" selected>User</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2">
                Sign In
            </button>

        </form>

        <p class="mt-3 text-muted">
            Don't have an account?
            <a href="signup.html" class="text-success fw-semibold">Sign up</a>
        </p>
    </div>

</body>

</html>
