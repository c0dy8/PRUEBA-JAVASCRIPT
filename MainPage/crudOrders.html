<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RestorApp | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <nav class="navbar bg-white shadow-sm px-4">
        <span class="navbar-brand fw-bold text-success">
            <i class="bi bi-shop"></i> RestorApp
        </span>
        <a href="login.html">
            <button class="btn btn-outline-success btn-sm">Log out</button>
        </a>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row g-4">
            <div class="col-lg-12">
                <div class="card dashboard-card">
                    <div class="card-body">

                        <h5 class="fw-bold text-success mb-3">
                            <i class="bi bi-basket"></i> Gestión de productos
                        </h5>

                        <form id="productForm" class="row g-3 mb-4">
                            <input type="hidden" id="productId">

                            <div class="col-md-4">
                                <input type="text" id="name" class="form-control" placeholder="Nombre del producto" required>
                            </div>

                            <div class="col-md-3">
                                <input type="number" id="price" class="form-control" placeholder="Precio" required>
                            </div>

                            <div class="col-md-3">
                                <input type="text" id="category" class="form-control" placeholder="Categoría" required>
                            </div>

                            <div class="col-md-2 d-grid">
                                <button class="btn btn-success" type="submit">Guardar</button>
                            </div>
                        </form>

                        <table class="table table-striped">
                            <thead class="table-success">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                    <th>Precio</th>
                                    <th>Categoría</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="productTable"></tbody>
                        </table>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="products.js"></script>
</body>
</html>
