<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RestorApp | Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="loginstyle.css">
    <script src="signup.js" defer></script>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="login-card text-center p-4 shadow bg-white" style="width: 360px;">
        <div class="app-icon mb-3">
            <i class="bi bi-person-plus-fill fs-3"></i>
        </div>

        <h4 class="fw-bold">Create Account</h4>
        <p class="text-muted mb-4">Sign up to get started</p>

        <form id="signupForm">

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" class="form-control" placeholder="Full name" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>
                <input type="email" class="form-control" placeholder="Email address" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control" placeholder="Password" required>
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text">
                    <i class="bi bi-briefcase"></i>
                </span>
                <select class="form-select">
                    <option value="User" selected>User</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2">
                Sign Up
            </button>

        </form>

        <p class="mt-3 text-muted">
            Already have an account?
            <a href="login.html" class="text-success fw-semibold">Sign in</a>
        </p>
    </div>

</body>
</html>
